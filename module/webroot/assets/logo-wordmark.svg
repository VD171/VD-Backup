<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="VDBackup">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#eef1f5"/>
      <stop offset="0.52" stop-color="#aeb6c2"/>
      <stop offset="0.66" stop-color="#d7dce3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="green" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#17c74a"/>
      <stop offset="1" stop-color="#36e86a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4040"/>
      <stop offset="1" stop-color="#cf1c1c"/>
    </linearGradient>
  </defs>

  <!-- green arrow, pointing LEFT (tucks behind the V) -->
  <path d="M58 150 L150 92 L150 123 L300 123 L300 177 L150 177 L150 208 Z" fill="url(#green)"/>
  <!-- red arrow, pointing RIGHT (tucks behind the D) -->
  <path d="M602 150 L510 92 L510 123 L360 123 L360 177 L510 177 L510 208 Z" fill="url(#red)"/>

  <!-- VD monogram: bold italic, metallic silver, dark bevel + drop -->
  <g transform="translate(330 150) skewX(-10)">
    <text x="3" y="6" text-anchor="middle" dominant-baseline="central"
          font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-style="italic"
          font-size="214" letter-spacing="-10" fill="#0c0e11">VD</text>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
          font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-style="italic"
          font-size="214" letter-spacing="-10"
          fill="url(#silver)" stroke="#16191f" stroke-width="5" paint-order="stroke">VD</text>
  </g>
</svg>
