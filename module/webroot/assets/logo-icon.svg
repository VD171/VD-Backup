<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="VDBackup">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#eef1f5"/>
      <stop offset="0.52" stop-color="#aeb6c2"/>
      <stop offset="0.66" stop-color="#d7dce3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="green" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#17c74a"/>
      <stop offset="1" stop-color="#36e86a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4040"/>
      <stop offset="1" stop-color="#cf1c1c"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="252" height="252" rx="56" fill="#0d0f12" stroke="#23262d" stroke-width="2"/>

  <!-- green arrow left, red arrow right (short shafts tuck behind VD) -->
  <path d="M24 128 L74 96 L74 116 L150 116 L150 140 L74 140 L74 160 Z" fill="url(#green)"/>
  <path d="M232 128 L182 96 L182 116 L106 116 L106 140 L182 140 L182 160 Z" fill="url(#red)"/>

  <!-- VD monogram -->
  <g transform="translate(128 132) skewX(-10)">
    <text x="2" y="4" text-anchor="middle" dominant-baseline="central"
          font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-style="italic"
          font-size="128" letter-spacing="-6" fill="#0c0e11">VD</text>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
          font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-style="italic"
          font-size="128" letter-spacing="-6"
          fill="url(#silver)" stroke="#16191f" stroke-width="3.5" paint-order="stroke">VD</text>
  </g>
</svg>
