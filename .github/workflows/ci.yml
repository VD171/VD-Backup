name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s sh module/*.sh || true
          shellcheck .github/scripts/*.sh || true

      - name: Validate JSON
        run: |
          for f in module/update.json module/webroot/config.json module/webroot/lang/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))" && echo "ok $f"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''          # the obsolete 'tools' default fails; we install exactly what we need below

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build helper dex
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: bash dex/build.sh

      - name: Assemble module zip (sanity)
        run: |
          cd module && zip -r9 ../VD-Backup-ci.zip . -x 'bin/*/.gitkeep'

      - uses: actions/upload-artifact@v4
        with:
          name: VD-Backup-ci
          path: VD-Backup-ci.zip
