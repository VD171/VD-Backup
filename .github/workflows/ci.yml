name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S error -s sh module/*.sh
          shellcheck -S error .github/scripts/*.sh

      - name: Validate JSON
        run: |
          for f in module/update.json module/update-*.json module/webroot/config.json module/webroot/lang/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))" && echo "ok $f"
          done

      - name: Kit guards (release-workflow-lint + SELinux staging)
        run: |
          # Self-contained guards (check only this repo) - gate HERE. vendor-parity (vs the private
          # kit) and engine-parity (vs VDLiveUpdate) compare against separate canonical repos not
          # fetched in CI, so they are enforced in the local pre-push ritual (no CI secret, by design).
          sh .github/scripts/release-workflow-lint.sh .
          sh .github/scripts/selinux-pm-stage-lint.sh .
          echo "vendor-parity + engine-parity: enforced in the local pre-push ritual"

      - name: i18n accent-fold guard (docs translations)
        run: |
          # Catch ASCII-folded accented-Latin translations (docs/, README.<code>.md, webroot/lang).
          # Guards the docs on every push/PR that touches them; this is NOT a release gate.
          sh .github/scripts/i18n-accents.sh .

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''          # the obsolete 'tools' default fails; we install exactly what we need below

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build helper dex
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: bash dex/build.sh

      - name: Assemble module zip (sanity)
        run: |
          cd module && zip -r9 ../VD-Backup-ci.zip . -x 'bin/*/.gitkeep'

      - uses: actions/upload-artifact@v7
        with:
          name: VD-Backup-ci
          path: VD-Backup-ci.zip
