# ======================================================================
#
#  Regenerate the lean body for an ALREADY published release and apply it as
#  github-actions[bot], WITHOUT rebuilding. A local `gh release edit` uses a
#  human PAT and re-attributes the release, breaking auditability
#  (github_release_sempre_bot_author); from CI the bot stays the author.
#  Rebuilding instead would churn the non-reproducible dex/APK bytes and
#  desync the live VDLU feed, so this only rewrites the notes.
#
#  Use it to bring an older release up to the current body (changelog +
#  @Priv8_VD banner) or after editing release-notes-body.sh.
name: Refresh release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to refresh, e.g. v1.19"
        required: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate notes for ${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
        run: |
          set -e
          gh release view "$VER" >/dev/null 2>&1 || { echo "::error::release $VER not found"; exit 1; }
          sh .github/scripts/release-notes-body.sh "$VER" > release-notes.md
          gh release edit "$VER" --notes-file release-notes.md
          # Drop the checksums asset if an older refresh attached one (releases carry only
          # the .zip / .tar.zst now; the per-file .sha256 inside each zip is the integrity gate).
          gh release delete-asset "$VER" SHA256SUMS.txt -y || true

      - name: Assert the release is still authored by github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
        run: |
          author="$(gh release view "$VER" --json author -q '.author.login')"
          if [ "$author" != "github-actions[bot]" ]; then
            echo "::error::Release $VER is authored by '$author', not github-actions[bot] - auditability rule violated."
            exit 1
          fi
