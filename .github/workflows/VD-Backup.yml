name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [ bump, patch, major, none ]
        default: bump
      notes:
        description: "Release notes (optional)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_COMPANION: ${{ secrets.VDB_COMPANION_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build per-ABI binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}   # authenticate the mtproto-store release lookup (unauth API rate-limits on shared runner IPs -> curl 22)
        run: bash .github/scripts/build_bin.sh

      # Supply-chain gate (STANDARDS 8, vendored kit guard): never ship a release without
      # per-ABI provenance. The v1.04 payload went out without it because that build was done
      # by hand (bypassing build_bin.sh). provenance-check fails the release if any bundled
      # binary under module/bin/<abi>/ lacks a PROVENANCE.json beside it that NAMES it. It runs
      # right after build_bin.sh, which writes bin/<abi>/PROVENANCE.json (source + sha256 of
      # every shipped file) for every ABI, so a clean build passes and a hand-made one fails.
      - name: Verify binary provenance (kit guard)
        run: sh .github/scripts/provenance-check.sh module

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''          # the obsolete 'tools' default fails; we install exactly what we need below

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build helper dex
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: bash dex/build.sh

      # Optional Google Drive companion. Built and bundled only when the signing
      # secret is configured; otherwise skipped (the module falls back to rclone
      # for Drive). The OAuth client id is injected from a secret when present.
      - name: Build Google Drive companion
        if: ${{ env.HAS_COMPANION == 'true' }}
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          VDB_COMPANION_STORE_PASS: ${{ secrets.VDB_COMPANION_STORE_PASS }}
          VDB_COMPANION_KEY_ALIAS: ${{ secrets.VDB_COMPANION_KEY_ALIAS }}
          VDB_COMPANION_KEY_PASS: ${{ secrets.VDB_COMPANION_KEY_PASS }}
          VDB_OAUTH_CLIENT_ID: ${{ secrets.VDB_OAUTH_CLIENT_ID }}
        run: |
          set -e
          echo "${{ secrets.VDB_COMPANION_KEYSTORE_B64 }}" | base64 -d > companion/release.keystore
          export VDB_COMPANION_KEYSTORE="$PWD/companion/release.keystore"
          if [ -n "$VDB_OAUTH_CLIENT_ID" ]; then
            sed -i "s#TODO_SET_YOUR_GOOGLE_CLOUD_OAUTH_CLIENT_ID.apps.googleusercontent.com#${VDB_OAUTH_CLIENT_ID}#" \
              companion/app/src/main/res/values/oauth.xml
          fi
          ( cd companion && ./gradlew --no-daemon :app:assembleRelease )
          cp "$(ls companion/app/build/outputs/apk/release/*.apk | head -1)" module/etc/companion.apk
          rm -f companion/release.keystore

      - name: Bump version
        if: ${{ inputs.bump != 'none' }}
        run: bash .github/scripts/version.sh "${{ inputs.bump }}"

      - name: Read version
        id: v
        run: echo "name=$(sed -n 's/^version=//p' module/module.prop)" >> "$GITHUB_OUTPUT"

      # Regenerate the documentation screenshots from the WebUI on EVERY release (bump or
      # not), so the version badge and any UI/string change always land in docs/screenshots/.
      # channel="chrome" uses the runner's preinstalled Google Chrome; no network. The
      # updated PNGs are tracked, so the commit step below carries them. Part of the ritual,
      # never a separate pending step.
      - name: Regenerate documentation screenshots
        run: |
          pip install --quiet playwright
          python3 tools/screenshots/shoot.py

      # version.sh writes update.json with the single-zip URL; point it at the
      # full asset (superset: every ABI + every binary). Runs on both the
      # bump and no-bump paths so the committed/zipped update.json is correct.
      - name: Point update.json at the full asset
        env:
          VER: ${{ steps.v.outputs.name }}
        run: |
          set -e
          url="https://github.com/VD171/VD-Backup/releases/download/${VER}/VD-Backup-${VER}-universal-full.zip"
          sed -i "s#\"zipUrl\": \".*\"#\"zipUrl\": \"${url}\"#" module/update.json

      # On-demand cloud addons: one per-ABI archive (rclone + restic + the lib closure)
      # that the lite edition fetches at first use and verifies against the sha256 baked
      # into etc/cloud_addons.json here. Built BEFORE the zips so every edition ships the
      # manifest; the archives are published as release assets below.
      - name: Package on-demand cloud addons
        env:
          VER: ${{ steps.v.outputs.name }}
        run: |
          set -e
          base="https://github.com/VD171/VD-Backup/releases/download/${VER}"
          mkdir -p module/etc
          printf '{\n' > module/etc/cloud_addons.json
          first=1
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            [ -d "module/bin/$abi" ] || continue
            out="assets-${VER}-$abi.tar.zst"
            ( cd "module/bin/$abi" && tar -c rclone restic $([ -d lib ] && echo lib) | zstd -19 -T0 -q -o "$GITHUB_WORKSPACE/$out" -f )
            sha=$(sha256sum "$out" | cut -d' ' -f1)
            size=$(stat -c%s "$out")
            [ $first = 1 ] || printf ',\n' >> module/etc/cloud_addons.json
            first=0
            printf '  "%s": {"url":"%s/%s","sha256":"%s","size":%s,"tools":["rclone","restic"]}' "$abi" "$base" "$out" "$sha" "$size" >> module/etc/cloud_addons.json
          done
          printf '\n}\n' >> module/etc/cloud_addons.json
          cat module/etc/cloud_addons.json

      - name: Stage README + LICENSE into the module
        run: cp README.md LICENSE module/

      # Six flashable assets, module contents at the zip root. Throwaway copies of
      # the staged module are pruned, then zipped. The lite variants drop only the
      # two largest binaries (rclone, restic); per-ABI variants keep one bin/<abi>/.
      - name: Assemble release zips
        env:
          VER: ${{ steps.v.outputs.name }}
        run: |
          set -e
          VCODE="$(sed -n 's/^versionCode=//p' module/module.prop)"
          # Per-variant updateJson (issue #15): each built zip's module.prop points to its OWN
          # update manifest, so the root manager keeps the installed variant on update instead of
          # always pulling universal-full. One sed per staged dir, like the per-variant pruning.
          RAW="https://raw.githubusercontent.com/VD171/VD-Backup/main/module"
          set_updatejson() { sed -i "s#^updateJson=.*#updateJson=${RAW}/$2#" "$1/module.prop"; }
          # Seed each variant with a KEYLESS vdlu/baseline.json: the content-addressed manifest of
          # exactly what THAT zip ships, so a fresh install is "born current" and its first VDLU
          # self-update is a proper incremental diff, not a from:0 full re-fetch. vdlu-pack only
          # hashes + gzips (NO private key), so it is safe in CI; the SIGNED feed is still produced
          # off-CI with the key. The manifest must match the INSTALLED tree, so the per-variant
          # pruning (lite drops rclone/restic; per-ABI keeps one bin/<abi>) happens BEFORE the seed,
          # and bin/*/.gitkeep is stripped (the zip -x drops it too). Non-fatal: if the seed ever
          # fails, the zip simply ships without a baseline and the engine does one from:0 fetch -
          # correct, never a broken release.
          seed_baseline() {  # <staged_module_dir>  (also prunes what should not reach the device)
            rm -f "$1"/bin/*/.gitkeep
            rm -f "$1"/vdlu/RELEASE.md          # dev doc: not shipped to device, not VDLU-managed (vdlu-pack excludes it too)
            if python3 .github/scripts/vdlu-pack "$1" "/tmp/bl-$(basename "$1")" vdbackup "$VCODE" \
                 --version-name "$VER" --channel stable >/dev/null 2>&1 \
               && [ -f "/tmp/bl-$(basename "$1")/manifest.json" ]; then
              cp "/tmp/bl-$(basename "$1")/manifest.json" "$1/vdlu/baseline.json"
            else
              echo "::warning::vdlu baseline seed failed for $1 - shipping without baseline (engine will from:0)"
            fi
          }
          # 1. universal-full: all ABIs, every binary
          cp -a module _m_unifull
          seed_baseline _m_unifull
          # STANDARDS 8: write a <file>.sha256 next to every shipped file, on the final pruned tree
          # right before each zip, so companions match exactly what that variant ships. vdlu-pack
          # excludes *.sha256, so they never enter the VDLU feed/baseline; a human-checkable fail-safe.
          sh .github/scripts/gen-sha256.sh _m_unifull
          ( cd _m_unifull && zip -r9 "../VD-Backup-${VER}-universal-full.zip" . -x 'bin/*/.gitkeep' )
          # 2. universal-lite: all ABIs, without the two largest binaries (rclone, restic)
          cp -a module _m_unilite
          rm -f _m_unilite/bin/*/rclone _m_unilite/bin/*/restic
          set_updatejson _m_unilite update-universal-lite.json
          seed_baseline _m_unilite
          sh .github/scripts/gen-sha256.sh _m_unilite
          ( cd _m_unilite && zip -r9 "../VD-Backup-${VER}-universal-lite.zip" . -x 'bin/*/.gitkeep' )
          # 3-6. per-ABI full: one ABI dir only, every binary for that architecture
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp -a module "_m_$abi"
            for d in "_m_$abi"/bin/*/; do
              [ "$(basename "$d")" = "$abi" ] || rm -rf "$d"
            done
            set_updatejson "_m_$abi" "update-$abi.json"
            seed_baseline "_m_$abi"
            sh .github/scripts/gen-sha256.sh "_m_$abi"
            ( cd "_m_$abi" && zip -r9 "../VD-Backup-${VER}-$abi-full.zip" . -x 'bin/*/.gitkeep' )
          done

      # STANDARDS 8 (vendored kit guard): a flashable zip must never ship an orphan
      # `<file>.sha256` whose target file was dropped by the `zip -x`. On-device the
      # mandatory sha256-gate would then abort the ENTIRE flash. zip-orphan-check reads
      # the FINAL artifacts, so a bad prune fails here in CI instead of on a user device.
      - name: Check release zips for orphan .sha256 companions
        env:
          VER: ${{ steps.v.outputs.name }}
        run: |
          command -v unzip >/dev/null 2>&1 || sudo apt-get install -y unzip
          sh .github/scripts/zip-orphan-check.sh VD-Backup-${VER}-*.zip

      # Fill update.json size/sha256 from the built universal-full zip + the release
      # notes, so the in-app update-check verb can show download size and what is new.
      - name: Fill update.json size/sha256/notes
        env:
          VER: ${{ steps.v.outputs.name }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          zip="VD-Backup-${VER}-universal-full.zip"
          sz=$(stat -c%s "$zip")
          sh=$(sha256sum "$zip" | cut -d' ' -f1)
          tmp=$(mktemp)
          jq --argjson size "$sz" --arg sha "$sh" --arg notes "$NOTES" \
             '.size=$size | .sha256=$sha | .notes=$notes' module/update.json > "$tmp"
          mv "$tmp" module/update.json
          cat module/update.json

      # Per-variant update manifests (issue #15): clone the just-filled update.json into one
      # manifest per non-full variant, each carrying that zip's real url/size/sha256 (version,
      # versionCode, changelog and notes are inherited). Each variant zip's module.prop already
      # points here (set in Assemble), so the root manager keeps the installed variant on update.
      - name: Generate per-variant update manifests
        env:
          VER: ${{ steps.v.outputs.name }}
        run: |
          set -e
          base="https://github.com/VD171/VD-Backup/releases/download/${VER}"
          gen() {  # <zip-suffix> <manifest>
            zip="VD-Backup-${VER}-$1.zip"
            sz=$(stat -c%s "$zip"); sh=$(sha256sum "$zip" | cut -d' ' -f1)
            jq --arg url "${base}/${zip}" --argjson size "$sz" --arg sha "$sh" \
               '.zipUrl=$url | .size=$size | .sha256=$sha' module/update.json > "module/$2"
            cat "module/$2"
          }
          gen universal-lite   update-universal-lite.json
          gen arm64-v8a-full   update-arm64-v8a.json
          gen armeabi-v7a-full update-armeabi-v7a.json
          gen x86-full         update-x86.json
          gen x86_64-full      update-x86_64.json

      # MMRL: the client has no 50MB install cap (confirmed against the official MMRL repo), so the
      # feed serves the universal-lite directly - smaller footprint, cloud binaries (rclone/restic)
      # fetched on demand via the signed VDLU feed. The in-app update.json stays on the full zip.
      - name: Fill update-mmrl.json (universal-lite channel)
        env:
          VER: ${{ steps.v.outputs.name }}
        run: |
          set -e
          zip="VD-Backup-${VER}-universal-lite.zip"
          sz=$(stat -c%s "$zip")
          sh=$(sha256sum "$zip" | cut -d' ' -f1)
          url="https://github.com/VD171/VD-Backup/releases/download/${VER}/${zip}"
          jq --arg url "$url" --argjson size "$sz" --arg sha "$sh" \
             '.zipUrl=$url | .size=$size | .sha256=$sha' module/update.json > module/update-mmrl.json
          cat module/update-mmrl.json

      # Always commit the release artifacts (regenerated screenshots, filled update.json and
      # any version bump), so no manual follow-up is ever pending after a release, including
      # the no-bump path. Authored as github-actions[bot] so every CI-made commit is auditably
      # distinct from a human VD171 commit (owner HARD rule; the gh release is already the bot).
      - name: Commit release changes
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never commit the CI-injected OAuth client id: it belongs only in the built APK,
          # not in the tree. Restore the placeholder before the blanket artifact commit so
          # "git commit -am" cannot sweep the real id onto the public branch.
          git checkout -- companion/app/src/main/res/values/oauth.xml 2>/dev/null || true
          # Stage NEW screenshot dirs too (git commit -am only catches tracked files): a newly
          # added language, e.g. uk, has an untracked docs/screenshots/<lang>/ that -am would miss.
          git add docs/screenshots module/update-mmrl.json \
                  module/update-universal-lite.json module/update-arm64-v8a.json \
                  module/update-armeabi-v7a.json module/update-x86.json module/update-x86_64.json 2>/dev/null || true
          git commit -am "Release ${{ steps.v.outputs.name }} (assets, screenshots, update.json)" || true
          git push || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.name }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          # Build notes: user-provided notes, the asset legend, then the channel banner
          # LAST (always). Strip any banner pasted into NOTES so it never duplicates nor
          # lands mid-body.
          notes_clean=$(printf '%s\n' "$NOTES" | grep -vi 't.me/Priv8_VD' || true)
          {
            printf '%s\n\n' "$notes_clean"
            printf '### Assets\n\n'
            printf -- '- `VD-Backup-%s-universal-full.zip` - every architecture, every binary (incl. rclone for cloud providers and restic for snapshots). Works on any device.\n' "$VER"
            printf -- '- `VD-Backup-%s-universal-lite.zip` - every architecture, without the two largest binaries (rclone, restic). Smallest; local, SSH/SFTP and rsync backups.\n' "$VER"
            printf -- '- `VD-Backup-%s-<abi>-full.zip` - a single architecture, every binary (smaller than universal-full).\n\n' "$VER"
            printf 'full = every binary, including rclone (cloud providers) and restic (snapshots).\n'
            printf 'lite = without the two largest binaries (rclone, restic); it fetches them on demand (verified by SHA-256) the first time you use a cloud or snapshot feature. Local, SSH/SFTP and rsync work without any download.\n'
            printf 'universal = every architecture; per-ABI = pick your device (arm64-v8a, armeabi-v7a, x86, x86_64).\n'
            printf '\nThe `assets-<abi>.tar.zst` files are the on-demand rclone+restic addons the lite edition downloads on first cloud use; they are not flashable builds, do not flash them.\n'
            printf '\n---\n\n'
            printf '📣 Join the channel for updates: @Priv8_VD https://t.me/Priv8_VD\n'
          } > release-notes.md
          # Idempotent: drop any existing release/tag for this version first.
          gh release delete "$VER" -y --cleanup-tag || true
          gh release create "$VER" \
            "VD-Backup-${VER}-universal-full.zip" \
            "VD-Backup-${VER}-universal-lite.zip" \
            "VD-Backup-${VER}-arm64-v8a-full.zip" \
            "VD-Backup-${VER}-armeabi-v7a-full.zip" \
            "VD-Backup-${VER}-x86-full.zip" \
            "VD-Backup-${VER}-x86_64-full.zip" \
            assets-${VER}-*.tar.zst \
            --title "VDBackup ${VER}" \
            --notes-file release-notes.md

      # Auditability guard (owner HARD rule, github_release_sempre_bot_author): every release MUST be
      # published by github-actions[bot], never a human account. GH_TOKEN above is github.token (the
      # Actions bot), so this holds - but assert it, so a future switch to a user PAT (which would
      # publish the release under that user) fails the workflow loud instead of shipping unaudited.
      - name: Assert the release author is github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.name }}
        run: |
          author="$(gh release view "$VER" --json author -q '.author.login')"
          if [ "$author" != "github-actions[bot]" ]; then
            echo "::error::Release $VER was authored by '$author', not github-actions[bot] - auditability rule violated. The release step must use github.token, never a user PAT."
            exit 1
          fi
          echo "Release author verified: github-actions[bot]"
