name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [ bump, patch, major, none ]
        default: bump
      notes:
        description: "Release notes (optional)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_COMPANION: ${{ secrets.VDB_COMPANION_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build per-ABI binaries
        run: bash .github/scripts/build_bin.sh

      # Supply-chain gate: never ship a release without per-ABI provenance. The v1.04
      # payload went out without it because that build was done by hand (bypassing
      # build_bin.sh); this fails the release if any bundled ABI lacks PROVENANCE.json.
      - name: Verify provenance present
        run: |
          set -e
          miss=0
          for d in module/bin/*/; do
            b="$(basename "$d")"; [ "$b" = "lib" ] && continue
            if [ ! -s "${d}PROVENANCE.json" ]; then echo "::error::missing PROVENANCE.json in $d"; miss=1; fi
          done
          [ "$miss" = 0 ] || { echo "Refusing to release binaries without provenance."; exit 1; }
          echo "provenance present for every bundled ABI"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''          # the obsolete 'tools' default fails; we install exactly what we need below

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build helper dex
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: bash dex/build.sh

      # Optional Google Drive companion. Built and bundled only when the signing
      # secret is configured; otherwise skipped (the module falls back to rclone
      # for Drive). The OAuth client id is injected from a secret when present.
      - name: Build Google Drive companion
        if: ${{ env.HAS_COMPANION == 'true' }}
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          VDB_COMPANION_STORE_PASS: ${{ secrets.VDB_COMPANION_STORE_PASS }}
          VDB_COMPANION_KEY_ALIAS: ${{ secrets.VDB_COMPANION_KEY_ALIAS }}
          VDB_COMPANION_KEY_PASS: ${{ secrets.VDB_COMPANION_KEY_PASS }}
          VDB_OAUTH_CLIENT_ID: ${{ secrets.VDB_OAUTH_CLIENT_ID }}
        run: |
          set -e
          echo "${{ secrets.VDB_COMPANION_KEYSTORE_B64 }}" | base64 -d > companion/release.keystore
          export VDB_COMPANION_KEYSTORE="$PWD/companion/release.keystore"
          if [ -n "$VDB_OAUTH_CLIENT_ID" ]; then
            sed -i "s#TODO_SET_YOUR_GOOGLE_CLOUD_OAUTH_CLIENT_ID.apps.googleusercontent.com#${VDB_OAUTH_CLIENT_ID}#" \
              companion/app/src/main/res/values/oauth.xml
          fi
          ( cd companion && ./gradlew --no-daemon :app:assembleRelease )
          cp "$(ls companion/app/build/outputs/apk/release/*.apk | head -1)" module/etc/companion.apk
          rm -f companion/release.keystore

      - name: Bump version
        if: ${{ inputs.bump != 'none' }}
        run: bash .github/scripts/version.sh "${{ inputs.bump }}"

      - name: Read version
        id: v
        run: echo "name=$(sed -n 's/^version=//p' module/module.prop)" >> "$GITHUB_OUTPUT"

      # Regenerate the documentation screenshots from the WebUI on EVERY release (bump or
      # not), so the version badge and any UI/string change always land in docs/screenshots/.
      # channel="chrome" uses the runner's preinstalled Google Chrome; no network. The
      # updated PNGs are tracked, so the commit step below carries them. Part of the ritual,
      # never a separate pending step.
      - name: Regenerate documentation screenshots
        run: |
          pip install --quiet playwright
          python3 tools/screenshots/shoot.py

      # version.sh writes update.json with the single-zip URL; point it at the
      # full asset (superset: every ABI + every binary). Runs on both the
      # bump and no-bump paths so the committed/zipped update.json is correct.
      - name: Point update.json at the full asset
        env:
          VER: ${{ steps.v.outputs.name }}
        run: |
          set -e
          url="https://github.com/VD171/VD-Backup/releases/download/${VER}/VD-Backup-${VER}-universal-full.zip"
          sed -i "s#\"zipUrl\": \".*\"#\"zipUrl\": \"${url}\"#" module/update.json

      # On-demand cloud addons: one per-ABI archive (rclone + restic + the lib closure)
      # that the lite edition fetches at first use and verifies against the sha256 baked
      # into etc/cloud_addons.json here. Built BEFORE the zips so every edition ships the
      # manifest; the archives are published as release assets below.
      - name: Package on-demand cloud addons
        env:
          VER: ${{ steps.v.outputs.name }}
        run: |
          set -e
          base="https://github.com/VD171/VD-Backup/releases/download/${VER}"
          mkdir -p module/etc
          printf '{\n' > module/etc/cloud_addons.json
          first=1
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            [ -d "module/bin/$abi" ] || continue
            out="assets-${VER}-$abi.tar.zst"
            ( cd "module/bin/$abi" && tar -c rclone restic $([ -d lib ] && echo lib) | zstd -19 -T0 -q -o "$GITHUB_WORKSPACE/$out" -f )
            sha=$(sha256sum "$out" | cut -d' ' -f1)
            size=$(stat -c%s "$out")
            [ $first = 1 ] || printf ',\n' >> module/etc/cloud_addons.json
            first=0
            printf '  "%s": {"url":"%s/%s","sha256":"%s","size":%s,"tools":["rclone","restic"]}' "$abi" "$base" "$out" "$sha" "$size" >> module/etc/cloud_addons.json
          done
          printf '\n}\n' >> module/etc/cloud_addons.json
          cat module/etc/cloud_addons.json

      - name: Stage README + LICENSE into the module
        run: cp README.md LICENSE module/

      # Six flashable assets, module contents at the zip root. Throwaway copies of
      # the staged module are pruned, then zipped. The lite variants drop only the
      # two largest binaries (rclone, restic); per-ABI variants keep one bin/<abi>/.
      - name: Assemble release zips
        env:
          VER: ${{ steps.v.outputs.name }}
        run: |
          set -e
          # 1. universal-full: all ABIs, every binary
          cp -a module _m_unifull
          ( cd _m_unifull && zip -r9 "../VD-Backup-${VER}-universal-full.zip" . -x 'bin/*/.gitkeep' )
          # 2. universal-lite: all ABIs, without the two largest binaries (rclone, restic)
          cp -a module _m_unilite
          rm -f _m_unilite/bin/*/rclone _m_unilite/bin/*/restic
          ( cd _m_unilite && zip -r9 "../VD-Backup-${VER}-universal-lite.zip" . -x 'bin/*/.gitkeep' )
          # 3-6. per-ABI full: one ABI dir only, every binary for that architecture
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp -a module "_m_$abi"
            for d in "_m_$abi"/bin/*/; do
              [ "$(basename "$d")" = "$abi" ] || rm -rf "$d"
            done
            ( cd "_m_$abi" && zip -r9 "../VD-Backup-${VER}-$abi-full.zip" . -x 'bin/*/.gitkeep' )
          done

      # Fill update.json size/sha256 from the built universal-full zip + the release
      # notes, so the in-app update-check verb can show download size and what is new.
      - name: Fill update.json size/sha256/notes
        env:
          VER: ${{ steps.v.outputs.name }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          zip="VD-Backup-${VER}-universal-full.zip"
          sz=$(stat -c%s "$zip")
          sh=$(sha256sum "$zip" | cut -d' ' -f1)
          tmp=$(mktemp)
          jq --argjson size "$sz" --arg sha "$sh" --arg notes "$NOTES" \
             '.size=$size | .sha256=$sha | .notes=$notes' module/update.json > "$tmp"
          mv "$tmp" module/update.json
          cat module/update.json

      # Always commit the release artifacts (regenerated screenshots, filled update.json and
      # any version bump), so no manual follow-up is ever pending after a release, including
      # the no-bump path. VD171 authorship to match the repo's clean-commit convention.
      - name: Commit release changes
        run: |
          git config user.name  'VD $ VD171 @ Priv8'
          git config user.email '80125987+VD171@users.noreply.github.com'
          git commit -am "Release ${{ steps.v.outputs.name }} (assets, screenshots, update.json)" || true
          git push || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.name }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          # Build notes: user-provided notes plus the asset legend.
          {
            printf '%s\n\n' "$NOTES"
            printf '### Assets\n\n'
            printf -- '- `VD-Backup-%s-universal-full.zip` - every architecture, every binary (incl. rclone for cloud providers and restic for snapshots). Works on any device.\n' "$VER"
            printf -- '- `VD-Backup-%s-universal-lite.zip` - every architecture, without the two largest binaries (rclone, restic). Smallest; local, SSH/SFTP and rsync backups.\n' "$VER"
            printf -- '- `VD-Backup-%s-<abi>-full.zip` - a single architecture, every binary (smaller than universal-full).\n\n' "$VER"
            printf 'full = every binary, including rclone (cloud providers) and restic (snapshots).\n'
            printf 'lite = without the two largest binaries (rclone, restic); it fetches them on demand (verified by SHA-256) the first time you use a cloud or snapshot feature. Local, SSH/SFTP and rsync work without any download.\n'
            printf 'universal = every architecture; per-ABI = pick your device (arm64-v8a, armeabi-v7a, x86, x86_64).\n'
            printf '\nThe `assets-<abi>.tar.zst` files are the on-demand rclone+restic addons the lite edition downloads on first cloud use; they are not flashable builds, do not flash them.\n'
          } > release-notes.md
          # Idempotent: drop any existing release/tag for this version first.
          gh release delete "$VER" -y --cleanup-tag || true
          gh release create "$VER" \
            "VD-Backup-${VER}-universal-full.zip" \
            "VD-Backup-${VER}-universal-lite.zip" \
            "VD-Backup-${VER}-arm64-v8a-full.zip" \
            "VD-Backup-${VER}-armeabi-v7a-full.zip" \
            "VD-Backup-${VER}-x86-full.zip" \
            "VD-Backup-${VER}-x86_64-full.zip" \
            assets-${VER}-*.tar.zst \
            --title "VDBackup ${VER}" \
            --notes-file release-notes.md
